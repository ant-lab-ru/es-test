name: Проверка 1.1.2 Первый проект

on:
  workflow_call:
    inputs:
      project:
        description: Папка проекта в репозитории обучающегося
        required: false
        type: string
        default: "112-blink"

jobs:
  check:
    name: Первый проект
    runs-on: ubuntu-latest
    steps:
      - name: Репозиторий обучающегося
        uses: actions/checkout@v7
        with:
          path: student

      - name: Проверки курса
        uses: actions/checkout@v7
        with:
          repository: ant-lab-ru/es-test
          path: es-test

      - name: Инструменты сборки
        uses: ant-lab-ru/es-test/.github/actions/pico-toolchain@master

      - name: Проверка
        run: es-test/checks/check-1-1-2.sh student "${{ inputs.project }}"
